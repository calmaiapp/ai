<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Calm</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Back to Home -->
        <a href="../index.html" class="back-home">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M15 10H5" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M10 15L5 10L10 5" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Back to Calm
        </a>

        <!-- Main Content -->
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-logo">
                <div class="logo-circle">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                        <circle cx="20" cy="20" r="18" stroke="#0ea5e9" stroke-width="2"/>
                        <path d="M20 12V28" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round"/>
                        <path d="M12 20H28" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <h1>Calm</h1>
                <p class="auth-tagline">Peaceful conversations</p>
            </div>

            <!-- Login Form -->
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        placeholder="you@example.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Password</label>
                        <a href="../auth/index.html?forgot" class="forgot-link">Forgot password?</a>
                    </div>
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <!-- Remember Me -->
                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="auth-btn" id="loginBtn">
                    <span>Sign In</span>
                    <svg class="btn-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M16.6667 10H3.33337" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M11.6667 5L16.6667 10L11.6667 15" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>

                <!-- Divider -->
                <div class="divider">
                    <span>or</span>
                </div>

                <!-- Social Login -->
                <div class="social-login">
                    <button type="button" class="social-btn google">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M19.25 10.22C19.25 9.55 19.19 8.86 19.06 8.19H10V12.05H15.42C15.17 13.29 14.47 14.37 13.46 15.09V17.57H16.96C18.45 16.19 19.25 14.24 19.25 10.22Z" fill="#4285F4"/>
                            <path d="M10 19.5C12.1 19.5 13.97 18.81 15.46 17.57L11.96 15.09C11.24 15.57 10.31 15.86 10 15.86C7.97 15.86 6.27 14.49 5.66 12.65H2.07V15.19C3.55 18.07 6.62 19.5 10 19.5Z" fill="#34A853"/>
                            <path d="M5.66 12.65C5.41 11.89 5.26 11.08 5.26 10.25C5.26 9.42 5.41 8.61 5.66 7.85V5.31H2.07C1.22 6.91 0.75 8.73 0.75 10.25C0.75 11.77 1.22 13.59 2.07 15.19L5.66 12.65Z" fill="#FBBC05"/>
                            <path d="M10 4.64C11.25 4.64 12.38 5.09 13.29 5.98L16.04 3.23C14.54 1.83 12.47 1 10 1C6.62 1 3.55 2.43 2.07 5.31L5.66 7.85C6.27 6.01 7.97 4.64 10 4.64Z" fill="#EA4335"/>
                        </svg>
                        Continue with Google
                    </button>
                </div>

                <!-- Sign Up Link -->
                <div class="auth-footer">
                    <p>Don't have an account? <a href="../auth/index.html?signup" class="auth-link">Sign up</a></p>
                </div>
            </form>

            <!-- Loading State -->
            <div class="loading-overlay" id="loadingOverlay">
                <div class="loading-spinner"></div>
            </div>
        </div>

        <!-- Footer Note -->
        <div class="auth-note">
            <p>By continuing, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a></p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="login.js"></script>
    <script src="../utils/auth.js"></script>
    <script src="../utils/supabase.js"></script>
</body>
</html>
