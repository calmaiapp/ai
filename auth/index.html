<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up • Calm</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="../logo.png" type="image/png">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
        
        .terms-agreement {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 20px 0;
            font-size: 14px;
            color: #475569;
        }
        
        .terms-agreement input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        
        .terms-agreement input[type="checkbox"]:checked {
            background: #0ea5e9;
            border-color: #0ea5e9;
        }
        
        .terms-links {
            display: flex;
            gap: 15px;
            margin-top: 8px;
        }
        
        .terms-links a {
            color: #0ea5e9;
            text-decoration: none;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: #f0f9ff;
        }
        
        .terms-links a:hover {
            background: #0ea5e9;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Back to Home -->
        <a href="../index.html" class="back-home">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M15 10H5" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M10 15L5 10L10 5" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Back to Calm
        </a>

        <!-- Main Content -->
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-logo">
                <div class="logo-circle">
                    <img src="../logo.png" alt="Calm Logo" style="width: 40px; height: 40px;">
                </div>
                <h1>Calm</h1>
                <p class="auth-tagline">Peaceful conversations</p>
            </div>

            <!-- Sign Up Form -->
            <div class="auth-form-wrapper" id="signupForm">
                <h2>Create Account</h2>
                <p class="auth-subtitle">Join Calm for peaceful conversations</p>
                
                <form class="auth-form" id="signupFormElement">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username"
                            placeholder="Choose a username"
                            required
                            autocomplete="username"
                        >
                        <div class="password-hint">
                            <span>This will be used to log in</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signupEmail">Email</label>
                        <input 
                            type="email" 
                            id="signupEmail" 
                            name="email"
                            placeholder="you@example.com"
                            required
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <input 
                            type="password" 
                            id="signupPassword" 
                            name="password"
                            placeholder="Create a password"
                            required
                            autocomplete="new-password"
                        >
                        <div class="password-hint">
                            <span>Must be at least 6 characters</span>
                        </div>
                    </div>

                    <!-- Security question section added by JavaScript -->

                    <!-- Terms -->
                    <div class="terms-agreement">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">
                            I agree to the 
                            <a href="#terms" style="color: #0ea5e9; text-decoration: none;">
                                Terms & Conditions
                            </a> 
                            and 
                            <a href="#privacy" style="color: #0ea5e9; text-decoration: none;">
                                Privacy Policy
                            </a>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="auth-btn" id="signupBtn">
                        <span>Create Account</span>
                        <svg class="btn-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M16.6667 10H3.33337" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                            <path d="M11.6667 5L16.6667 10L11.6667 15" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>

                    <!-- Divider -->
                    <div class="divider">
                        <span>or</span>
                    </div>

                    <!-- Social Sign Up -->
                    <div class="social-login">
                        <button type="button" class="social-btn google">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M19.25 10.22C19.25 9.55 19.19 8.86 19.06 8.19H10V12.05H15.42C15.17 13.29 14.47 14.37 13.46 15.09V17.57H16.96C18.45 16.19 19.25 14.24 19.25 10.22Z" fill="#4285F4"/>
                                <path d="M10 19.5C12.1 19.5 13.97 18.81 15.46 17.57L11.96 15.09C11.24 15.57 10.31 15.86 10 15.86C7.97 15.86 6.27 14.49 5.66 12.65H2.07V15.19C3.55 18.07 6.62 19.5 10 19.5Z" fill="#34A853"/>
                                <path d="M5.66 12.65C5.41 11.89 5.26 11.08 5.26 10.25C5.26 9.42 5.41 8.61 5.66 7.85V5.31H2.07C1.22 6.91 0.75 8.73 0.75 10.25C0.75 11.77 1.22 13.59 2.07 15.19L5.66 12.65Z" fill="#FBBC05"/>
                                <path d="M10 4.64C11.25 4.64 12.38 5.09 13.29 5.98L16.04 3.23C14.54 1.83 12.47 1 10 1C6.62 1 3.55 2.43 2.07 5.31L5.66 7.85C6.27 6.01 7.97 4.64 10 4.64Z" fill="#EA4335"/>
                            </svg>
                            Sign up with Google
                        </button>
                    </div>

                    <!-- Login Link -->
                    <div class="auth-footer">
                        <p>Already have an account? <a href="../login/index.html" class="auth-link">Sign in</a></p>
                    </div>
                </form>
            </div>

            <!-- Loading State -->
            <div class="loading-overlay" id="loadingOverlay">
                <div class="loading-spinner"></div>
            </div>
        </div>

        <!-- Footer Note -->
        <div class="auth-note">
            <p>Your data is protected with end-to-end encryption</p>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="script.js"></script>
</body>
</html>
